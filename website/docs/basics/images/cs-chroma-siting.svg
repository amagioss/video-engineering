<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 428" width="940" height="428" role="img" aria-label="Chroma siting: left, center and top-left co-sited"><rect x="0.5" y="0.5" width="939" height="427" rx="14" fill="#fbfcfe" stroke="#d9e0e8"/><text x="28.0" y="42.0" font-size="17" fill="#17212b" text-anchor="start" font-weight="650" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Chroma siting: where exactly does the shared color sample sit?</text><text x="28.0" y="63.0" font-size="12.5" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Identical 4:2:0 data, three different opinions about position. Guess wrong and every color edge slides half a pixel.</text><rect x="26.00" y="86.00" width="272.00" height="208.00" rx="10" fill="#ffffff" stroke="#d9e0e8" stroke-width="1"/><text x="40.0" y="106.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="650" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Left  /  MPEG-2 style</text><text x="40.0" y="123.0" font-size="10.5" fill="#2b6cb0" text-anchor="start" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">chroma_loc = left  (type 0)</text><rect x="46.00" y="128.00" width="36.00" height="36.00" rx="0" fill="#ffffff" stroke="#e4eaf0" stroke-width="1"/><circle cx="64.00" cy="146.00" r="3.00" fill="#1c2733"/><rect x="82.00" y="128.00" width="36.00" height="36.00" rx="0" fill="#ffffff" stroke="#e4eaf0" stroke-width="1"/><circle cx="100.00" cy="146.00" r="3.00" fill="#1c2733"/><rect x="46.00" y="164.00" width="36.00" height="36.00" rx="0" fill="#ffffff" stroke="#e4eaf0" stroke-width="1"/><circle cx="64.00" cy="182.00" r="3.00" fill="#1c2733"/><rect x="82.00" y="164.00" width="36.00" height="36.00" rx="0" fill="#ffffff" stroke="#e4eaf0" stroke-width="1"/><circle cx="100.00" cy="182.00" r="3.00" fill="#1c2733"/><line x1="64.00" y1="122.00" x2="64.00" y2="206.00" stroke="#2b6cb0" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/><line x1="40.00" y1="182.00" x2="124.00" y2="182.00" stroke="#2b6cb0" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/><circle cx="64.00" cy="182.00" r="10.00" fill="#2b6cb0" opacity="0.14"/><circle cx="64.00" cy="182.00" r="10.00" fill="none" stroke="#2b6cb0" stroke-width="2.4"/><text x="40.0" y="222.0" font-size="10.5" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">On the even luma column horizontally,</text><text x="40.0" y="237.0" font-size="10.5" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">halfway between the two luma rows</text><text x="40.0" y="252.0" font-size="10.5" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">vertically.</text><text x="40.0" y="284.0" font-size="10.5" fill="#17212b" text-anchor="start" font-weight="600" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Seen in:</text><text x="98.0" y="284.0" font-size="10.5" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">H.262, H.264, HEVC, AV1 default</text><rect x="326.00" y="86.00" width="272.00" height="208.00" rx="10" fill="#ffffff" stroke="#d9e0e8" stroke-width="1"/><text x="340.0" y="106.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="650" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Center  /  MPEG-1, JPEG</text><text x="340.0" y="123.0" font-size="10.5" fill="#2b6cb0" text-anchor="start" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">chroma_loc = center  (type 1)</text><rect x="346.00" y="128.00" width="36.00" height="36.00" rx="0" fill="#ffffff" stroke="#e4eaf0" stroke-width="1"/><circle cx="364.00" cy="146.00" r="3.00" fill="#1c2733"/><rect x="382.00" y="128.00" width="36.00" height="36.00" rx="0" fill="#ffffff" stroke="#e4eaf0" stroke-width="1"/><circle cx="400.00" cy="146.00" r="3.00" fill="#1c2733"/><rect x="346.00" y="164.00" width="36.00" height="36.00" rx="0" fill="#ffffff" stroke="#e4eaf0" stroke-width="1"/><circle cx="364.00" cy="182.00" r="3.00" fill="#1c2733"/><rect x="382.00" y="164.00" width="36.00" height="36.00" rx="0" fill="#ffffff" stroke="#e4eaf0" stroke-width="1"/><circle cx="400.00" cy="182.00" r="3.00" fill="#1c2733"/><line x1="400.00" y1="122.00" x2="400.00" y2="206.00" stroke="#2b6cb0" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/><line x1="340.00" y1="182.00" x2="424.00" y2="182.00" stroke="#2b6cb0" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/><circle cx="400.00" cy="182.00" r="10.00" fill="#2b6cb0" opacity="0.14"/><circle cx="400.00" cy="182.00" r="10.00" fill="none" stroke="#2b6cb0" stroke-width="2.4"/><text x="340.0" y="222.0" font-size="10.5" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Halfway in both directions: dead centre</text><text x="340.0" y="237.0" font-size="10.5" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">of the 2x2 luma quad.</text><text x="340.0" y="284.0" font-size="10.5" fill="#17212b" text-anchor="start" font-weight="600" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Seen in:</text><text x="398.0" y="284.0" font-size="10.5" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">JPEG, MPEG-1, most still images</text><rect x="626.00" y="86.00" width="272.00" height="208.00" rx="10" fill="#ffffff" stroke="#d9e0e8" stroke-width="1"/><text x="640.0" y="106.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="650" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Top-left co-sited</text><text x="640.0" y="123.0" font-size="10.5" fill="#2b6cb0" text-anchor="start" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">chroma_loc = topleft  (type 2)</text><rect x="646.00" y="128.00" width="36.00" height="36.00" rx="0" fill="#ffffff" stroke="#e4eaf0" stroke-width="1"/><circle cx="664.00" cy="146.00" r="3.00" fill="#1c2733"/><rect x="682.00" y="128.00" width="36.00" height="36.00" rx="0" fill="#ffffff" stroke="#e4eaf0" stroke-width="1"/><circle cx="700.00" cy="146.00" r="3.00" fill="#1c2733"/><rect x="646.00" y="164.00" width="36.00" height="36.00" rx="0" fill="#ffffff" stroke="#e4eaf0" stroke-width="1"/><circle cx="664.00" cy="182.00" r="3.00" fill="#1c2733"/><rect x="682.00" y="164.00" width="36.00" height="36.00" rx="0" fill="#ffffff" stroke="#e4eaf0" stroke-width="1"/><circle cx="700.00" cy="182.00" r="3.00" fill="#1c2733"/><line x1="664.00" y1="122.00" x2="664.00" y2="206.00" stroke="#2b6cb0" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/><line x1="640.00" y1="146.00" x2="724.00" y2="146.00" stroke="#2b6cb0" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/><circle cx="664.00" cy="146.00" r="10.00" fill="#2b6cb0" opacity="0.14"/><circle cx="664.00" cy="146.00" r="10.00" fill="none" stroke="#2b6cb0" stroke-width="2.4"/><text x="640.0" y="222.0" font-size="10.5" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Exactly on top of the top-left luma</text><text x="640.0" y="237.0" font-size="10.5" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">sample of the quad.</text><text x="640.0" y="284.0" font-size="10.5" fill="#17212b" text-anchor="start" font-weight="600" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Seen in:</text><text x="698.0" y="284.0" font-size="10.5" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Some UHD/HDR and camera formats</text><rect x="28.00" y="344.00" width="884.00" height="58.00" rx="8" fill="#fff8ed" stroke="#f0d9b5" stroke-width="1"/><text x="44.0" y="366.0" font-size="11.5" fill="#b45309" text-anchor="start" font-weight="700" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Symptom of getting it wrong:</text><text x="238.0" y="366.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">a faint colored fringe on one side of every high-contrast edge, and colors that creep by half a</text><text x="44.0" y="384.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">pixel every time you scale or transcode. It survives every quality check that only looks at Y'.</text></svg>