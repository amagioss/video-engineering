<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-label="The four parts of a color space"><rect x="0.5" y="0.5" width="979" height="329" rx="14" fill="#fbfcfe" stroke="#d9e0e8"/><text x="28.0" y="44.0" font-size="17" fill="#17212b" text-anchor="start" font-weight="650" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">A color space is four independent decisions</text><text x="28.0" y="65.0" font-size="12.5" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Change any one of them and the picture changes. Most 'color bugs' are one of these four being mismatched.</text><rect x="28.00" y="104.00" width="224.00" height="182.00" rx="10" fill="#ffffff" stroke="#d9e0e8" stroke-width="1"/><rect x="28.00" y="104.00" width="224.00" height="4.00" rx="2" fill="#c0392b"/><circle cx="48.00" cy="134.00" r="10.50" fill="#c0392b"/><text x="48.0" y="138.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">1</text><text x="66.0" y="138.5" font-size="13.5" fill="#17212b" text-anchor="start" font-weight="650" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Primaries + white point</text><text x="44.0" y="160.0" font-size="11.5" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Which exact red, green and blue?</text><text x="44.0" y="184.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">BT.601 / SMPTE-C  (SD)</text><text x="44.0" y="201.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">BT.709 / sRGB  (HD)</text><text x="44.0" y="218.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">DCI-P3  (cinema)</text><text x="44.0" y="235.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">BT.2020  (UHD)</text><line x1="44.00" y1="256.00" x2="236.00" y2="256.00" stroke="#e4eaf0" stroke-width="1" stroke-linecap="round"/><text x="44.0" y="271.0" font-size="10.5" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Defines the gamut: the set of</text><text x="44.0" y="284.0" font-size="10.5" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">colors that can be named at all.</text><rect x="260.00" y="104.00" width="224.00" height="182.00" rx="10" fill="#ffffff" stroke="#d9e0e8" stroke-width="1"/><rect x="260.00" y="104.00" width="224.00" height="4.00" rx="2" fill="#b7791f"/><circle cx="280.00" cy="134.00" r="10.50" fill="#b7791f"/><text x="280.0" y="138.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">2</text><text x="298.0" y="138.5" font-size="13.5" fill="#17212b" text-anchor="start" font-weight="650" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Transfer function</text><text x="276.0" y="160.0" font-size="11.5" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">How code values map to light</text><text x="276.0" y="184.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">sRGB / BT.1886  (SDR)</text><text x="276.0" y="201.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">PQ / ST 2084  (HDR)</text><text x="276.0" y="218.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">HLG / BT.2100  (HDR)</text><text x="276.0" y="235.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Linear  (compositing)</text><line x1="276.00" y1="256.00" x2="468.00" y2="256.00" stroke="#e4eaf0" stroke-width="1" stroke-linecap="round"/><text x="276.0" y="271.0" font-size="10.5" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Non-linear on purpose: it spends</text><text x="276.0" y="284.0" font-size="10.5" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">bits where the eye can see them.</text><rect x="492.00" y="104.00" width="224.00" height="182.00" rx="10" fill="#ffffff" stroke="#d9e0e8" stroke-width="1"/><rect x="492.00" y="104.00" width="224.00" height="4.00" rx="2" fill="#2b6cb0"/><circle cx="512.00" cy="134.00" r="10.50" fill="#2b6cb0"/><text x="512.0" y="138.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">3</text><text x="530.0" y="138.5" font-size="13.5" fill="#17212b" text-anchor="start" font-weight="650" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Matrix</text><text x="508.0" y="160.0" font-size="11.5" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">How R'G'B' becomes Y'CbCr</text><text x="508.0" y="184.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">BT.601  Kr .299  Kb .114</text><text x="508.0" y="201.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">BT.709  Kr .2126 Kb .0722</text><text x="508.0" y="218.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">BT.2020 Kr .2627 Kb .0593</text><text x="508.0" y="235.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">YCoCg / ICtCp</text><line x1="508.00" y1="256.00" x2="700.00" y2="256.00" stroke="#e4eaf0" stroke-width="1" stroke-linecap="round"/><text x="508.0" y="271.0" font-size="10.5" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Separates brightness from color</text><text x="508.0" y="284.0" font-size="10.5" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">so chroma can be thrown away.</text><rect x="724.00" y="104.00" width="224.00" height="182.00" rx="10" fill="#ffffff" stroke="#d9e0e8" stroke-width="1"/><rect x="724.00" y="104.00" width="224.00" height="4.00" rx="2" fill="#6b46c1"/><circle cx="744.00" cy="134.00" r="10.50" fill="#6b46c1"/><text x="744.0" y="138.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">4</text><text x="762.0" y="138.5" font-size="13.5" fill="#17212b" text-anchor="start" font-weight="650" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Range + sampling</text><text x="740.0" y="160.0" font-size="11.5" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">The bookkeeping that bites</text><text x="740.0" y="184.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Limited 16-235 vs full 0-255</text><text x="740.0" y="201.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">4:4:4 / 4:2:2 / 4:2:0</text><text x="740.0" y="218.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Chroma siting (left / center)</text><text x="740.0" y="235.0" font-size="11" fill="#17212b" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Bit depth 8 / 10 / 12</text><line x1="740.00" y1="256.00" x2="932.00" y2="256.00" stroke="#e4eaf0" stroke-width="1" stroke-linecap="round"/><text x="740.0" y="271.0" font-size="10.5" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Cheap to get wrong, and the</text><text x="740.0" y="284.0" font-size="10.5" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">result looks 'almost right'.</text><text x="28.0" y="312.0" font-size="11.5" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Pipelines carry these as metadata (color_primaries, color_trc, colorspace, color_range). Metadata that lies is worse than no metadata.</text></svg>