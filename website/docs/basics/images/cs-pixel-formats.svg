<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-label="Pixel format memory layouts I420 NV12 YUY2 AYUV"><rect x="0.5" y="0.5" width="979" height="469" rx="14" fill="#fbfcfe" stroke="#d9e0e8"/><text x="28.0" y="42.0" font-size="17" fill="#17212b" text-anchor="start" font-weight="650" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">The same 4:2:0 pixels, four ways in memory</text><text x="28.0" y="63.0" font-size="12.5" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Sampling ratio says how much color you keep. Pixel format says how those bytes are arranged. A 4x2 image is used below.</text><rect x="28.00" y="78.00" width="924.00" height="76.00" rx="10" fill="#ffffff" stroke="#d9e0e8" stroke-width="1"/><text x="44.0" y="96.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="650" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">I420 / YV12  (planar)</text><text x="44.0" y="114.0" font-size="10.5" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Three separate planes. Y full size, then U and V at quarter size each. YV12 is the same but V comes first.</text><rect x="44.00" y="124.00" width="0.00" height="0.00" rx="0" fill="none"/><text x="824.0" y="96.0" font-size="10.5" fill="#2b6cb0" text-anchor="start" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">ffmpeg: yuv420p</text><rect x="44.00" y="122.00" width="25.50" height="24.00" rx="3" fill="#3a4a5a"/><text x="56.8" y="137.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Y0</text><rect x="71.00" y="122.00" width="25.50" height="24.00" rx="3" fill="#3a4a5a"/><text x="83.8" y="137.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Y1</text><rect x="98.00" y="122.00" width="25.50" height="24.00" rx="3" fill="#3a4a5a"/><text x="110.8" y="137.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Y2</text><rect x="125.00" y="122.00" width="25.50" height="24.00" rx="3" fill="#3a4a5a"/><text x="137.8" y="137.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Y3</text><rect x="152.00" y="122.00" width="25.50" height="24.00" rx="3" fill="#3a4a5a"/><text x="164.8" y="137.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Y4</text><rect x="179.00" y="122.00" width="25.50" height="24.00" rx="3" fill="#3a4a5a"/><text x="191.8" y="137.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Y5</text><rect x="206.00" y="122.00" width="25.50" height="24.00" rx="3" fill="#3a4a5a"/><text x="218.8" y="137.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Y6</text><rect x="233.00" y="122.00" width="25.50" height="24.00" rx="3" fill="#3a4a5a"/><text x="245.8" y="137.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Y7</text><rect x="260.00" y="122.00" width="25.50" height="24.00" rx="3" fill="#2b6cb0"/><text x="272.8" y="137.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">U0</text><rect x="287.00" y="122.00" width="25.50" height="24.00" rx="3" fill="#2b6cb0"/><text x="299.8" y="137.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">U1</text><rect x="314.00" y="122.00" width="25.50" height="24.00" rx="3" fill="#c0392b"/><text x="326.8" y="137.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">V0</text><rect x="341.00" y="122.00" width="25.50" height="24.00" rx="3" fill="#c0392b"/><text x="353.8" y="137.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">V1</text><rect x="28.00" y="164.00" width="924.00" height="76.00" rx="10" fill="#ffffff" stroke="#d9e0e8" stroke-width="1"/><text x="44.0" y="182.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="650" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">NV12  (semi-planar)</text><text x="44.0" y="200.0" font-size="10.5" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Y plane, then a single plane of interleaved U,V pairs. What almost every GPU and hardware codec wants.</text><rect x="44.00" y="210.00" width="0.00" height="0.00" rx="0" fill="none"/><text x="824.0" y="182.0" font-size="10.5" fill="#2b6cb0" text-anchor="start" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">ffmpeg: nv12</text><rect x="44.00" y="208.00" width="25.50" height="24.00" rx="3" fill="#3a4a5a"/><text x="56.8" y="223.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Y0</text><rect x="71.00" y="208.00" width="25.50" height="24.00" rx="3" fill="#3a4a5a"/><text x="83.8" y="223.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Y1</text><rect x="98.00" y="208.00" width="25.50" height="24.00" rx="3" fill="#3a4a5a"/><text x="110.8" y="223.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Y2</text><rect x="125.00" y="208.00" width="25.50" height="24.00" rx="3" fill="#3a4a5a"/><text x="137.8" y="223.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Y3</text><rect x="152.00" y="208.00" width="25.50" height="24.00" rx="3" fill="#3a4a5a"/><text x="164.8" y="223.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Y4</text><rect x="179.00" y="208.00" width="25.50" height="24.00" rx="3" fill="#3a4a5a"/><text x="191.8" y="223.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Y5</text><rect x="206.00" y="208.00" width="25.50" height="24.00" rx="3" fill="#3a4a5a"/><text x="218.8" y="223.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Y6</text><rect x="233.00" y="208.00" width="25.50" height="24.00" rx="3" fill="#3a4a5a"/><text x="245.8" y="223.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Y7</text><rect x="260.00" y="208.00" width="25.50" height="24.00" rx="3" fill="#2b6cb0"/><text x="272.8" y="223.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">U0</text><rect x="287.00" y="208.00" width="25.50" height="24.00" rx="3" fill="#c0392b"/><text x="299.8" y="223.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">V0</text><rect x="314.00" y="208.00" width="25.50" height="24.00" rx="3" fill="#2b6cb0"/><text x="326.8" y="223.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">U1</text><rect x="341.00" y="208.00" width="25.50" height="24.00" rx="3" fill="#c0392b"/><text x="353.8" y="223.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">V1</text><rect x="28.00" y="250.00" width="924.00" height="76.00" rx="10" fill="#ffffff" stroke="#d9e0e8" stroke-width="1"/><text x="44.0" y="268.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="650" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">YUY2 / YUYV  (packed 4:2:2)</text><text x="44.0" y="286.0" font-size="10.5" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">No planes at all: two pixels per 4 bytes, luma first. Common on webcams and capture cards.</text><rect x="44.00" y="296.00" width="0.00" height="0.00" rx="0" fill="none"/><text x="824.0" y="268.0" font-size="10.5" fill="#2b6cb0" text-anchor="start" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">ffmpeg: yuyv422</text><rect x="44.00" y="294.00" width="25.50" height="24.00" rx="3" fill="#3a4a5a"/><text x="56.8" y="309.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Y0</text><rect x="71.00" y="294.00" width="25.50" height="24.00" rx="3" fill="#2b6cb0"/><text x="83.8" y="309.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">U0</text><rect x="98.00" y="294.00" width="25.50" height="24.00" rx="3" fill="#3a4a5a"/><text x="110.8" y="309.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Y1</text><rect x="125.00" y="294.00" width="25.50" height="24.00" rx="3" fill="#c0392b"/><text x="137.8" y="309.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">V0</text><rect x="152.00" y="294.00" width="25.50" height="24.00" rx="3" fill="#3a4a5a"/><text x="164.8" y="309.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Y2</text><rect x="179.00" y="294.00" width="25.50" height="24.00" rx="3" fill="#2b6cb0"/><text x="191.8" y="309.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">U1</text><rect x="206.00" y="294.00" width="25.50" height="24.00" rx="3" fill="#3a4a5a"/><text x="218.8" y="309.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Y3</text><rect x="233.00" y="294.00" width="25.50" height="24.00" rx="3" fill="#c0392b"/><text x="245.8" y="309.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">V1</text><rect x="28.00" y="336.00" width="924.00" height="76.00" rx="10" fill="#ffffff" stroke="#d9e0e8" stroke-width="1"/><text x="44.0" y="354.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="650" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">AYUV  (packed 4:4:4)</text><text x="44.0" y="372.0" font-size="10.5" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Four bytes per pixel with alpha. No chroma thrown away - used for graphics, keying and mastering.</text><rect x="44.00" y="382.00" width="0.00" height="0.00" rx="0" fill="none"/><text x="824.0" y="354.0" font-size="10.5" fill="#2b6cb0" text-anchor="start" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">ffmpeg: yuva444p*</text><rect x="44.00" y="380.00" width="25.50" height="24.00" rx="3" fill="#6b7280"/><text x="56.8" y="395.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">A0</text><rect x="71.00" y="380.00" width="25.50" height="24.00" rx="3" fill="#3a4a5a"/><text x="83.8" y="395.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Y0</text><rect x="98.00" y="380.00" width="25.50" height="24.00" rx="3" fill="#2b6cb0"/><text x="110.8" y="395.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">U0</text><rect x="125.00" y="380.00" width="25.50" height="24.00" rx="3" fill="#c0392b"/><text x="137.8" y="395.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">V0</text><rect x="152.00" y="380.00" width="25.50" height="24.00" rx="3" fill="#6b7280"/><text x="164.8" y="395.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">A1</text><rect x="179.00" y="380.00" width="25.50" height="24.00" rx="3" fill="#3a4a5a"/><text x="191.8" y="395.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Y1</text><rect x="206.00" y="380.00" width="25.50" height="24.00" rx="3" fill="#2b6cb0"/><text x="218.8" y="395.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">U1</text><rect x="233.00" y="380.00" width="25.50" height="24.00" rx="3" fill="#c0392b"/><text x="245.8" y="395.8" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">V1</text><rect x="28.00" y="418.00" width="924.00" height="0.00" rx="0" fill="none"/><rect x="44.00" y="428.00" width="12.00" height="12.00" rx="3" fill="#3a4a5a"/><text x="62.0" y="438.0" font-size="11" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Y (luma)</text><rect x="160.00" y="428.00" width="12.00" height="12.00" rx="3" fill="#2b6cb0"/><text x="178.0" y="438.0" font-size="11" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">U / Cb</text><rect x="276.00" y="428.00" width="12.00" height="12.00" rx="3" fill="#c0392b"/><text x="294.0" y="438.0" font-size="11" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">V / Cr</text><rect x="392.00" y="428.00" width="12.00" height="12.00" rx="3" fill="#6b7280"/><text x="410.0" y="438.0" font-size="11" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">alpha</text><text x="556.0" y="438.0" font-size="10.5" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">* ffmpeg has no AYUV; use yuv444p / yuva444p, or ayuv64le for 16-bit.</text></svg>