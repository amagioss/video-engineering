<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1073 316" width="1073" height="316" role="img" aria-label="Common video aspect ratios"><rect x="0.5" y="0.5" width="1072" height="315" rx="14" fill="#fbfcfe" stroke="#d9e0e8"/><text x="28.0" y="44.0" font-size="17" fill="#17212b" text-anchor="start" font-weight="650" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Common aspect ratios (width : height)</text><text x="28.0" y="65.0" font-size="12.5" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Same height, different widths. The circle stays round because every frame is shown at its correct ratio.</text><rect x="28.0" y="96" width="200.0" height="150" rx="4" fill="#1f2a36"/><circle cx="128.0" cy="171.0" r="63.0" fill="none" stroke="#2f6fb0" stroke-width="4"/><text x="128.0" y="272.0" font-size="15" fill="#17212b" text-anchor="middle" font-weight="650" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">4:3</text><text x="128.0" y="291.0" font-size="12.5" fill="#5d6b7a" text-anchor="middle" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">SD TV, old monitors</text><rect x="264.0" y="96" width="266.7" height="150" rx="4" fill="#1f2a36"/><circle cx="397.3" cy="171.0" r="63.0" fill="none" stroke="#2f6fb0" stroke-width="4"/><text x="397.3" y="272.0" font-size="15" fill="#17212b" text-anchor="middle" font-weight="650" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">16:9</text><text x="397.3" y="291.0" font-size="12.5" fill="#5d6b7a" text-anchor="middle" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">HD / 4K TV, YouTube</text><rect x="566.7" y="96" width="358.5" height="150" rx="4" fill="#1f2a36"/><circle cx="745.9" cy="171.0" r="63.0" fill="none" stroke="#2f6fb0" stroke-width="4"/><text x="745.9" y="272.0" font-size="15" fill="#17212b" text-anchor="middle" font-weight="650" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">2.39:1</text><text x="745.9" y="291.0" font-size="12.5" fill="#5d6b7a" text-anchor="middle" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Cinema scope</text><rect x="961.2" y="96" width="84.4" height="150" rx="4" fill="#1f2a36"/><circle cx="1003.4" cy="171.0" r="30.2" fill="none" stroke="#2f6fb0" stroke-width="4"/><text x="1003.4" y="272.0" font-size="15" fill="#17212b" text-anchor="middle" font-weight="650" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">9:16</text><text x="1003.4" y="291.0" font-size="12.5" fill="#5d6b7a" text-anchor="middle" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Phone: Reels, Shorts</text></svg>