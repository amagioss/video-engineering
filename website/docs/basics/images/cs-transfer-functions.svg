#17212b" text-anchor="start" font-weight="600" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">HDR: HLG on a 1000 nit display</text><line x1="578.00" y1="192.00" x2="606.00" y2="192.00" stroke="#8b3aa8" stroke-width="3" stroke-linecap="round"/><text x="616.0" y="196.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="600" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">HDR: PQ / ST 2084, 10 000 nit</text><line x1="578.00" y1="222.00" x2="606.00" y2="222.00" stroke="#9aa5b1" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 4"/><text x="616.0" y="226.0" font-size="11.5" fill="#17212b" text-anchor="start" font-weight="600" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Linear light (for reference)</text><rect x="560.00" y="278.00" width="352.00" height="180.00" rx="10" fill="#ffffff" stroke="#d9e0e8" stroke-width="1"/><text x="578.0" y="304.0" font-size="13" fill="#17212b" text-anchor="start" font-weight="650" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Rules of thumb</text><circle cx="584.00" cy="326.00" r="3.00" fill="#2b6cb0"/><text x="596.0" y="330.0" font-size="10.8" fill="#17212b" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Gamma-encoded values are perceptual, not physical.</text><text x="596.0" y="344.0" font-size="10.8" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Averaging two of them is not averaging light.</text><circle cx="584.00" cy="370.00" r="3.00" fill="#2b6cb0"/><text x="596.0" y="374.0" font-size="10.8" fill="#17212b" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Resize, blur, blend and alpha-composite in linear light,</text><text x="596.0" y="388.0" font-size="10.8" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">or you get dark halos and muddy cross-fades.</text><circle cx="584.00" cy="414.00" r="3.00" fill="#2b6cb0"/><text x="596.0" y="418.0" font-size="10.8" fill="#17212b" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">PQ is absolute: code 0.58 means about 100 nits on any</text><text x="596.0" y="432.0" font-size="10.8" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">display. HLG is relative and degrades gracefully to SDR.</text><text x="28.0" y="522.0" font-size="11.5" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">The prime mark matters: R'G'B' and Y' are gamma-encoded, R G B and Y are linear light. Nearly every video file you will touch is primed,</text><text x="28.0" y="540.0" font-size="11.5" fill="#5d6b7a" text-anchor="start" font-weight="400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">which is exactly why naive resizing and alpha blending look slightly wrong.</text></svg>